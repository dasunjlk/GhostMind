<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ghost Body Gradient: Solid White top -> Soft Shadow bottom -->
    <linearGradient id="ghostGrad" x1="50%" y1="10%" x2="50%" y2="95%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#D4D9E2"/>
      <stop offset="90%" stop-color="#737D8E"/>
      <stop offset="100%" stop-color="#2B303A"/>
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="glow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Pitch Black App Icon Base -->
  <rect width="512" height="512" rx="112" fill="#000000"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#222226" stroke-width="2"/>

  <!-- Soft Halo Behind Ghost -->
  <circle cx="256" cy="240" r="180" fill="url(#glow)"/>

  <!-- Ghost Body (Clean, Iconic Silhouette) -->
  <path d="
    M 256,70
    C 175,70 125,130 125,220
    C 125,280 95,330 95,375
    C 95,410 140,410 165,375
    C 185,345 220,415 256,415
    C 292,415 327,345 347,375
    C 372,410 417,410 417,375
    C 417,330 387,280 387,220
    C 387,130 337,70 256,70 Z"
    fill="url(#ghostGrad)"
  />

  <!-- Eyes -->
  <ellipse cx="212" cy="185" rx="15" ry="25" fill="#050507"/>
  <ellipse cx="300" cy="185" rx="15" ry="25" fill="#050507"/>
</svg>